version: it-2026.11.3
# Benchmarks below are PLACEHOLDER, uncalibrated industry medians.
# valuation and momentum have no IT rules yet, so they score None. sector_tailwind is scored
# from a sector_tailwind Fact if one exists, else from the sector agent's tailwind_input
# (evaluate(context=...)); with neither it is None.
rules:
  - metric: operating_margin        # percent
    comparison: higher_better
    benchmark: 22.0  # PLACEHOLDER, uncalibrated
    weight: 1.0
    horizon: long
    sub_score: quality
  - metric: attrition               # percent, annualised
    comparison: lower_better
    benchmark: 15.0  # PLACEHOLDER, uncalibrated
    weight: 1.0
    horizon: short
    sub_score: quality
  - metric: revenue_growth          # percent, YoY
    comparison: higher_better
    benchmark: 10.0  # PLACEHOLDER, uncalibrated
    weight: 1.0
    horizon: long
    sub_score: growth
  - metric: debt_equity             # ratio
    comparison: lower_better
    benchmark: 0.1  # PLACEHOLDER, uncalibrated
    weight: 1.0
    horizon: long
    sub_score: balance_sheet
  - metric: promoter_pledging       # percent of promoter holding pledged
    comparison: lower_better
    benchmark: 2.0  # PLACEHOLDER, uncalibrated
    weight: 1.0
    horizon: short
    sub_score: governance
  - metric: sector_tailwind         # 0-100, from the sector agent (SectorView.tailwind_input)
    comparison: higher_better
    benchmark: 50.0  # PLACEHOLDER, uncalibrated (50 = neutral sector view)
    weight: 0.25     # PLACEHOLDER, small: a single sector-level input
    horizon: long
    sub_score: sector_tailwind
  # Technicals (short horizon). Fed by price files (prices__*.csv); None without one.
  - metric: price_vs_sma200         # percent above (+) or below (-) the 200-day average
    comparison: higher_better
    benchmark: 10.0  # PLACEHOLDER, uncalibrated (the score scale needs a non-zero benchmark)
    weight: 1.0
    horizon: short
    sub_score: momentum
  - metric: momentum_3m             # percent price change over about 3 months
    comparison: higher_better
    benchmark: 10.0  # PLACEHOLDER, uncalibrated
    weight: 1.0
    horizon: short
    sub_score: momentum
red_flags:
  - metric: promoter_pledging
    operator: gt
    threshold: 20.0
    message: "High promoter pledging: {value:g}% exceeds {threshold:g}%"
