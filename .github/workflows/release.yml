name: release
# On every push to main (except deploy-only changes): build both images, push them to GHCR with
# the commit SHA as tag, then write that tag into deploy/k8s/kustomization.yaml. Argo CD sees the
# commit and rolls the cluster. Needs: repo Settings > Actions > General > Workflow permissions
# = "Read and write".
on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"
      - "docs/**"
      - "**.md"

permissions:
  contents: write
  packages: write

env:
  OWNER: nagendraanalytics

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER }}/ier-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          push: true
          build-args: NEXT_PUBLIC_API_BASE=/api
          tags: ghcr.io/${{ env.OWNER }}/ier-dashboard:${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
      - name: Point the manifests at the new images
        run: |
          cd deploy/k8s
          sed -i "/ier-api/{n;s/newTag: .*/newTag: ${GITHUB_SHA}/}" kustomization.yaml
          sed -i "/ier-dashboard/{n;s/newTag: .*/newTag: ${GITHUB_SHA}/}" kustomization.yaml
          cat kustomization.yaml
      - name: Commit the new tags
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add deploy/k8s/kustomization.yaml
          git commit -m "deploy: images ${GITHUB_SHA::7}" || exit 0
          git push
