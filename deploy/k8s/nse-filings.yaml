          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
          containers:
            - name: nse-filings-annual
              image: ghcr.io/nagendraanalytics/ier-api
              command: ["python", "-m", "ier.runtime", "nse-filings", "--kind", "annual"]
              env:
                - name: HOME
                  value: /tmp
              envFrom:
                - secretRef:
                    name: ier-secrets
              resources:
                requests: {memory: 256Mi, cpu: 100m}
                limits: {memory: 512Mi}
