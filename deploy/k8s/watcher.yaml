# Runs the workers and queues a company run when a filings folder changes (python -m ier.runtime watch).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: watcher
  template:
    metadata:
      labels:
        app: watcher
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: watcher
          image: ghcr.io/nagendraanalytics/ier-api
          command: ["python", "-m", "ier.runtime", "watch"]
          env:
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /app/data/.hf-cache
          envFrom:
            - secretRef:
                name: ier-secrets
          resources:
            requests: {memory: 512Mi, cpu: 200m}
            limits: {memory: 2Gi}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ier-data
