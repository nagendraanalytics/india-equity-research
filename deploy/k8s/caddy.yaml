# Public front door: https://ier.2.29.197.65.nip.io (nip.io resolves that name to the server IP).
# Caddy gets a Let's Encrypt certificate by itself, asks for the login in secret web-login
# (create it with deploy/create-web-login.sh), and routes:
#   /api/*  -> api service (prefix stripped)     everything else -> dashboard
# One origin for page and API, so no CORS is needed and the browser sends the login to both.
# hostNetwork lets it bind ports 80/443 on the single node (k3s runs without traefik/servicelb).
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddyfile
data:
  Caddyfile: |
    ier.2.29.197.65.nip.io {
    	encode gzip
    	basicauth {
    		{$WEB_USER} {$WEB_HASH}
    	}
    	handle_path /api/* {
    		reverse_proxy api:8000
    	}
    	handle {
    		reverse_proxy dashboard:3000
    	}
    }
---
# Certificates must survive restarts (Let's Encrypt rate-limits re-issuing).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
spec:
  replicas: 1
  strategy:
    type: Recreate        # the old pod must release ports 80/443 first
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: caddy
          image: caddy:2
          envFrom:
            - secretRef:
                name: web-login
          volumeMounts:
            - {name: config, mountPath: /etc/caddy}
            - {name: data, mountPath: /data}
          resources:
            requests: {memory: 32Mi, cpu: 10m}
            limits: {memory: 128Mi}
      volumes:
        - name: config
          configMap:
            name: caddyfile
        - name: data
          persistentVolumeClaim:
            claimName: caddy-data
