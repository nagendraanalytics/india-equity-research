# SYNTHETIC golden set for the IT slice. Every company, ISIN, filing, number and quote below is
# INVENTED. Nothing here is real data, and this file is NOT the hand-checked real-company golden
# set the spec asks for (that set is still an OPEN ITEM that only the owner can supply, see
# tests/golden/RUNBOOK.md).
#
# WHAT THESE RANGES ARE (read this before trusting a green run):
#   * Every benchmark in src/ier/rules/config/it.yaml, the score scale in
#     ier.rules.engine.score_value, and every weight/band/gate in signals.yaml are PLACEHOLDERS.
#   * The expected ranges below were derived BY HAND from exactly those placeholders (the
#     arithmetic is in the comments next to each company). They are therefore a REGRESSION GUARD
#     for the rules as currently configured (change a benchmark, a weight or a band and these
#     fail on purpose). They are NOT a validation of investment quality, and they are circular by
#     construction: the expected values come from the same rules they test.
#   * The model is a deterministic stub (tests/golden/harness.py). What it "extracts" and
#     "drafts" is written in this file. So the run proves the plumbing (ingest -> facts -> rules
#     -> claims -> verifier -> scorecard -> signal, queue, events), not model quality.
#
# Hand-arithmetic conventions (from engine.score_value and it.yaml):
#   score(v) = clamp(50 + 50 * rel, 0, 100); rel = (v - bench) / |bench|, sign flipped when
#   lower_better.  Benchmarks: operating_margin 22 (higher), attrition 15 (lower),
#   revenue_growth 10 (higher), debt_equity 0.1 (lower), promoter_pledging 2 (lower),
#   sector_tailwind 50 (higher, weight 0.25; all others weight 1).
#   Sub-scores: quality = mean(operating_margin, attrition); growth = revenue_growth;
#   balance_sheet = debt_equity; governance = promoter_pledging; sector_tailwind = tailwind.
#   valuation and momentum have no IT rules, so they are always null.
#   long  (weighted) = operating_margin, revenue_growth, debt_equity (w1 each) + tailwind (w0.25)
#   short (mean)     = attrition, promoter_pledging
#   combined = 0.6 * long + 0.4 * short (signals.yaml weights); if one side is missing the other
#   is used alone.  Bands: >=70 accumulate, >=50 hold, >=30 reduce, else avoid.
#   Confidence (synthesis.yaml): low if kept distinct evidence chunks < 3 or more than 3 null
#   sub-scores; high needs <=1 null sub-score, which is unreachable while valuation and
#   momentum have no rules (2 nulls), so the best reachable value today is "medium".
#   Red flag: promoter_pledging > 20 -> cap at hold.  Confidence "low" -> insufficient evidence.
#
# Shared sector input. One Tier-2 sector document; the stub sector model lists one driver
# (severity 3, +1) and one risk (severity 2, -1). tailwind_input = clamp(50 + 10*(3*1 + 2*-1))
# = 60, so the sector_tailwind sub-score = 50 + 50*(60-50)/50 = 60.0 for every company.
#
# Range convention: [hand value - 0.5, hand value + 0.5], rounded to 2 places.

macro_sector: Information Technology

sector:
  name: Software
  industry: IT Services
  document:
    url: https://sectors.invalid/golden/software-outlook.txt
    title: Synthetic software sector outlook
    tier: 2
    text: >-
      Synthetic Software sector outlook. Demand for cloud migration services is rising across
      large enterprises. Wage inflation is expected to raise employee costs for IT services firms.
  drivers:
    - {text: "Demand for cloud migration services is rising across large enterprises.",
       find: "Demand for cloud migration services", severity: 3, direction: 1, model_verdict: true}
  risks:
    - {text: "Wage inflation is expected to raise employee costs for IT services firms.",
       find: "Wage inflation is expected", severity: 2, direction: -1, model_verdict: true}
  expected_tailwind: 60.0

